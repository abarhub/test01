<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage de données JSON avec Vue.js 3</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Vue.js 3</h1>
        <template>
            <div>
                <select v-model="selectedOption" @change="handleOptionChange">
                    <option v-for="option in options" :value="option.value" :key="option.value">{{ option.label }}</option>
                </select>
            </div>
        </template>
        <template>
          <div>
            <label for="fruit-select">Choisis un fruit :</label>
            <select id="fruit-select" v-model="selectedFruit">
              <option v-for="fruit in fruits" :key="fruit" :value="fruit">
                {{ fruit }}
              </option>
            </select>

            <p>Fruit sélectionné : {{ selectedFruit }}</p>
          </div>
        </template>

        <template v-if="error">
            <p style="color: red;">Erreur lors du chargement du fichier JSON : {{ error }}</p>
        </template>
        <template v-else-if="data.length > 0">
            <h2>Données chargées :</h2>
            <table>
                <thead>
                    <tr>
                        <th v-for="(value, key, index) in data[0]" :key="key">{{ key }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, index) in data" :key="index">
                        <td v-for="(value, key) in item" :key="key">{{ value }}</td>
                    </tr>
                </tbody>
            </table>
        </template>
        <template v-else-if="loading">
            <p>Chargement des données...</p>
        </template>
        <template v-else>
            <p>Aucune donnée à afficher.</p>
        </template>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const data = ref([]);
                const loading = ref(false);
                const error = ref(null);
                const jsonFilePath = 'data_complet.json';
                const options=ref([]);
                const selectedOption=ref(null);


                const fetchData = async () => {
                    loading.value = true;
                    error.value = null;
                    selectedOption.value = null;
                    options.value=[
                            { label: 'Option 1', value: 'option1' },
                            { label: 'Option 2', value: 'option2' },
                            { label: 'Option 3', value: 'option3' },
                            ];
                    try {
                        const response = await fetch(jsonFilePath);
                        if (!response.ok) {
                            throw new Error(`Erreur HTTP: ${response.status}`);
                        }
                        let tmp = await response.json();
                        if(tmp&&tmp.liste1){
                            data.value=tmp.liste1;
                        }
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        loading.value = false;
                    }
                };

                const handleOptionChange= ()=> {
                    // Perform the action you want with the selected option
                    console.log("Selected option:", this.selectedOption);
                };

                // Liste des options
                const fruits = ref(['Pomme', 'Banane', 'Orange', 'Fraise'])

                // Valeur sélectionnée
                const selectedFruit = ref('')

                fetchData();

                return {
                    data,
                    loading,
                    error,
                    options,
                    selectedOption,
                    handleOptionChange,
                    fruits,
                    selectedFruit
                };
            },
            handleOptionChange() {
                // Perform the action you want with the selected option
                console.log("Selected option:", this.selectedOption);
            },
        }).mount('#app');
    </script>
</body>
</html>
