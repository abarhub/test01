<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage de données JSON avec Vue.js 3</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Vue.js 3</h1>
        <div class="select-container">
            <label for="options">Choisissez une option :</label>
            <select id="options" v-model="selectedOption">
                <option disabled value="">Veuillez sélectionner</option>
                <option v-for="option in options" :value="option.value">
                    {{ option.text }}
                </option>
            </select>
        </div>

        <p v-if="selectedOption">
            Vous avez sélectionné : <strong>{{ getSelectedText() }}</strong>
        </p>
<!--        <template>-->
<!--            <div>-->
<!--                <select v-model="selectedOption" @change="handleOptionChange">-->
<!--                    <option v-for="option in options" :value="option.value" :key="option.value">{{ option.label }}</option>-->
<!--                </select>-->
<!--            </div>-->
<!--        </template>-->
<!--        <template>-->
<!--          <div>-->
<!--            <label for="fruit-select">Choisis un fruit :</label>-->
<!--            <select id="fruit-select" v-model="selectedFruit">-->
<!--              <option v-for="fruit in fruits" :key="fruit" :value="fruit">-->
<!--                {{ fruit }}-->
<!--              </option>-->
<!--            </select>-->

<!--            <p>Fruit sélectionné : {{ selectedFruit }}</p>-->
<!--          </div>-->
<!--        </template>-->

        <template v-if="error">
            <p style="color: red;">Erreur lors du chargement du fichier JSON : {{ error }}</p>
        </template>
        <template v-else-if="data.length > 0">
            <h2>Données chargées :</h2>
            <table>
                <thead>
                    <tr>
<!--                        <th v-for="(value, key, index) in data[0]" :key="key">{{ key }}</th>-->
                        <th>Type</th>
                        <th>Nom</th>
                        <th>Debut</th>
                        <th>Fin</th>
                        <th>Duree</th>
                        <th>Favorie</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, index) in data" :key="index">
<!--                        <td v-for="(value, key) in item" :key="key">{{ value }}</td>-->
                        <td>{{ item.event_name }}</td>
                        <td>{{ item.nom }}</td>
                        <td>{{ item.event_start }}</td>
                        <td>{{ item.event_finish }}</td>
                        <td>{{ item.event_duration }}</td>
                        <td>{{ item.favori }}</td>
                    </tr>
                </tbody>
            </table>
        </template>
        <template v-else-if="loading">
            <p>Chargement des données...</p>
        </template>
        <template v-else>
            <p>Aucune donnée à afficher.</p>
        </template>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const data = ref([]);
                const loading = ref(false);
                const error = ref(null);
                const jsonFilePath = 'https://abarhub.github.io/test01/data_complet.json';
                const listeComplete=ref({});
                const jourSelectionner = ref(0);
                //const options=ref([]);
                //const selectedOption=ref(null);


                const fetchData = async () => {
                    loading.value = true;
                    error.value = null;
                    //selectedOption.value = null;
                    // options.value=[
                    //         { label: 'Option 1', value: 'option1' },
                    //         { label: 'Option 2', value: 'option2' },
                    //         { label: 'Option 3', value: 'option3' },
                    //         ];
                    try {
                        const response = await fetch(jsonFilePath);
                        if (!response.ok) {
                            throw new Error(`Erreur HTTP: ${response.status}`);
                        }
                        let tmp = await response.json();
                        if(tmp){
                            listeComplete.value = tmp;
                            if(tmp.liste1) {
                                jourSelectionner.value = 1;
                                data.value = tmp.liste1;
                            }
                        }
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        loading.value = false;
                    }
                };

                const handleOptionChange= ()=> {
                    // Perform the action you want with the selected option
                    console.log("Selected option:", this.selectedOption);
                };

                // Liste des options
                // const fruits = ref(['Pomme', 'Banane', 'Orange', 'Fraise'])
                //
                // // Valeur sélectionnée
                // const selectedFruit = ref('')

                const selectedOption = ref('');

                const options = ref([
                    { value: '1', text: 'Mercredi' },
                    { value: '2', text: 'Jeudi' },
                    { value: '3', text: 'Vendredi' }
                ]);

                const getSelectedText = () => {
                    const option = options.value.find(opt => opt.value === selectedOption.value);
                    let nb=selectedOption.value;
                    if(nb){
                        console.log('nb selected', nb);
                        if(nb>=1&&nb<=3){

                            if(nb===1){
                                jourSelectionner.value = 1;
                                data.value = listeComplete.value.liste1;
                            } else if(nb===2){
                                jourSelectionner.value = 2;
                                data.value = listeComplete.value.liste2;
                            } else if(nb===3){
                                jourSelectionner.value = 3;
                                data.value = listeComplete.value.liste3;
                            }
                            console.log('jour selected', jourSelectionner.value, data.value.length);
                        }
                    }
                    return option ? option.text : '';
                };

                fetchData();

                return {
                    data,
                    loading,
                    error,
                    listeComplete,
                    jourSelectionner,
                    // options,
                    // selectedOption,
                    handleOptionChange,
                    // fruits,
                    // selectedFruit
                    selectedOption,
                    options,
                    getSelectedText
                };
            },
            handleOptionChange() {
                // Perform the action you want with the selected option
                console.log("Selected option:", this.selectedOption);
            },
        }).mount('#app');
    </script>
</body>
</html>
