<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage de données JSON avec Vue.js 3</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div id="app">
        <template v-if="error">
            <p style="color: red;">Erreur lors du chargement du fichier JSON : {{ error }}</p>
        </template>
        <template v-else-if="data.length > 0">
            <h2>Données chargées :</h2>
            <table>
                <thead>
                    <tr>
                        <th v-for="(value, key, index) in data[0]" :key="key">{{ key }}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, index) in data" :key="index">
                        <td v-for="(value, key) in item" :key="key">{{ value }}</td>
                    </tr>
                </tbody>
            </table>
        </template>
        <template v-else-if="loading">
            <p>Chargement des données...</p>
        </template>
        <template v-else>
            <p>Aucune donnée à afficher.</p>
        </template>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const data = ref([]);
                const loading = ref(false);
                const error = ref(null);
                const jsonFilePath = 'data_1.json'; // Chemin vers votre fichier JSON

                const fetchData = async () => {
                    loading.value = true;
                    error.value = null;
                    try {
                        const response = await fetch(jsonFilePath);
                        if (!response.ok) {
                            throw new Error(`Erreur HTTP: ${response.status}`);
                        }
                        let tmp = await response.json();
                        if(tmp&&tmp.liste){
                            data.value=tmp.liste;
                        }
                    } catch (err) {
                        error.value = err.message;
                    } finally {
                        loading.value = false;
                    }
                };

                fetchData();

                return {
                    data,
                    loading,
                    error
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
